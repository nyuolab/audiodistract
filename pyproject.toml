[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_distract"
version = "1.0.0"
description = "Tools for evaluating incidental-information contamination in clinical notes, audio and reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Krithik Vishwanath"}, {name = "Eric K. Oermann"}]
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.0,<3", "pyarrow>=14", "scipy>=1.10", "statsmodels>=0.14",
  "matplotlib>=3.7", "pyyaml>=6", "tqdm>=4.65", "datasets>=2.18", "huggingface_hub>=0.23",
]

[project.optional-dependencies]
api = ["openai>=1.30", "anthropic>=0.30", "google-genai>=1.0", "python-dotenv>=1.0"]
gpu = ["torch>=2.2", "transformers>=4.44", "accelerate>=0.30", "safetensors>=0.4", "sentencepiece>=0.2"]
vllm = ["vllm>=0.6"]
dev = ["pytest>=8", "ruff>=0.5"]
audio = ["soundfile>=0.12", "torchcodec>=0.2"]

[project.urls]
Repository = "https://github.com/nyuolab/audiodistract"
Issues = "https://github.com/nyuolab/audiodistract/issues"
Paper = "https://arxiv.org/abs/2610.08585"

[tool.setuptools.packages.find]
include = ["llm_distract*"]

[tool.setuptools.package-data]
llm_distract = ["release.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[project.scripts]
meddistract-download = "llm_distract.download:main"
